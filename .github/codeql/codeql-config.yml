# CodeQL scan-path exclusions for Friendship Hospital HIS.
#
# The files listed under paths-ignore are NOT dead/duplicate source code —
# they are historical snapshots of index.html, each created via GitHub's
# web-upload "rename" workflow right before a new index.html was pushed
# (see git log: every one of these is literally a "Rename index.html to
# <name>" commit). CLAUDE.md documents this convention explicitly and says
# not to edit them or treat them as current -- only index.html is live.
#
# CodeQL was scanning every one of these old snapshots independently,
# which is why a single real finding in index.html turned into 900+ alerts
# (the same historical code duplicated across ~40 renamed copies). This
# file excludes exactly those known snapshot filenames -- listed
# explicitly rather than by wildcard, so a future legitimate file can never
# be accidentally swept in by a loose glob pattern. index.html and the
# Supabase Edge Functions under supabase/functions/ are NOT excluded and
# keep being scanned normally.
#
# Regenerate this list any time a new snapshot is added:
#   git ls-files '*.html' '*.htm' | grep -vFx 'index.html'

name: Friendship Hospital HIS CodeQL config
paths-ignore:
